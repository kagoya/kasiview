<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KasiView | Tesla歌詞ビューア</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans JP",sans-serif;background:#10141d;color:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:#1a2230;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0}button,input,textarea{font:inherit}button{border:0;border-radius:12px;background:#34435b;color:white;padding:12px 18px;cursor:pointer;min-height:48px}button.primary{background:#2777dc}button:active{filter:brightness(1.2)}input,textarea{background:#202a39;color:white;border:1px solid #50617b;border-radius:10px;padding:12px;width:100%}textarea{min-height:220px;resize:vertical}main{max-width:1300px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#192230;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex-shrink:0}.grow{flex:1;min-width:180px}label{display:block;margin:10px 0 5px;color:#c5d2e5}.hidden{display:none!important}#viewer{height:62vh;overflow-y:auto;scroll-behavior:auto;background:#090d14;border-radius:16px;padding:28px 5vw;overscroll-behavior:contain}#lyrics{font-size:32px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}#songTitle{text-align:center;font-size:22px;font-weight:700;margin:8px}#artist{text-align:center;color:#aebfd4;margin-bottom:14px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.muted{color:#aebfd4;font-size:14px}#status{min-height:22px}.compact header,.compact #editor,.compact #settings,.compact #links{display:none}.compact main{max-width:none;padding:0}.compact #viewer{height:89vh;border-radius:0}.compact #lyrics{font-size:var(--fs,32px)}.compact .controls{margin:5px}@media(max-width:600px){#viewer{height:55vh}#lyrics{font-size:26px}main{padding:10px}}
</style></head><body>
<header><h1>♪ KasiView</h1><nav><button onclick="show('editor')">歌詞入力</button><button onclick="show('links')">プチリリ検索</button><button onclick="show('settings')">設定</button><button onclick="toggleFocus()">集中表示</button></nav></header>
<main>
<section id="editor" class="panel"><div class="row"><div class="grow"><label>曲名</label><input id="titleInput" placeholder="曲名"></div><div class="grow"><label>アーティスト</label><input id="artistInput" placeholder="アーティスト名"></div></div><label>歌詞（利用許諾のあるテキストを入力）</label><textarea id="textInput" placeholder="ここに歌詞を入力、またはTXT / LRCを読み込みます"></textarea><div class="row" style="margin-top:12px"><button class="primary" onclick="applyLyrics()">表示する</button><input id="file" type="file" accept=".txt,.lrc,text/plain" style="max-width:300px" onchange="loadFile(event)"><button onclick="loadSample()">サンプル</button></div></section>
<section id="links" class="panel hidden"><h2>プチリリ公式検索</h2><p class="muted">公式ページで歌詞を検索します。外部サイトの歌詞を自動取得する機能はありません。</p><div class="row"><input id="query" class="grow" placeholder="曲名・アーティスト名"><button class="primary" onclick="searchPetit()">公式サイトで検索</button></div><label>公式歌詞ページURL（ブックマーク）</label><div class="row"><input id="official" class="grow" placeholder="https://petitlyrics.com/lyrics/..."><button onclick="saveLink()">保存</button><button onclick="openOfficial()">開く</button></div></section>
<section id="settings" class="panel hidden"><h2>表示設定</h2><label>文字サイズ：<output id="sizeVal">32</output>px</label><input id="fontSize" type="range" min="18" max="72" value="32" oninput="updateSettings()"><label>自動スクロール速度：<output id="speedVal">25</output>px/秒</label><input id="speed" type="range" min="5" max="120" value="25" oninput="updateSettings()"><button onclick="toggleFullscreen()">全画面表示</button><p class="muted">設定と入力した歌詞はこのブラウザに保存されます。Teslaブラウザの保存データが消えると失われます。</p></section>
<section class="panel" id="display"><div id="songTitle">サンプル曲</div><div id="artist">KasiView</div><div id="viewer"><div id="lyrics"></div></div><div class="controls"><button onclick="page(-1)">◀ 前へ</button><button id="play" class="primary" onclick="toggleScroll()">▶ 自動スクロール</button><button onclick="page(1)">次へ ▶</button><button onclick="resetScroll()">先頭へ</button><button onclick="toggleFocus()">集中表示</button></div><p id="status" class="muted" style="text-align:center"></p></section>
</main><script>
const $=id=>document.getElementById(id);let running=false,last=0,frame=0,scrollPosition=0;
const sample=Array.from({length:12},(_,i)=>`【${i+1}番】\n空を見上げて\n風の音を聞いて\nゆっくり歩いていこう\n\n新しい景色が\n今日も待っている\n\n小さな一歩から\n明日が始まる`).join('\n\n')+'\n\n（これは動作確認用のオリジナル文章です）';
function show(id){for(const x of ['editor','links','settings'])$(x).classList.toggle('hidden',x!==id);document.body.classList.remove('compact')}
function applyLyrics(){stop();scrollPosition=0;$('lyrics').textContent=$('textInput').value||sample;$('songTitle').textContent=$('titleInput').value||'無題';$('artist').textContent=$('artistInput').value||'';$('viewer').scrollTop=0;persist();$('status').textContent='歌詞を表示しました'}
function loadSample(){$('titleInput').value='サンプル曲';$('artistInput').value='KasiView';$('textInput').value=sample;applyLyrics()}
function loadFile(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{$('textInput').value=String(reader.result).replace(/^\[[0-9:.]+\]/gm,'');$('titleInput').value=f.name.replace(/\.(txt|lrc)$/i,'');applyLyrics()};reader.readAsText(f)}
function updateSettings(){$('sizeVal').textContent=$('fontSize').value;$('speedVal').textContent=$('speed').value;$('lyrics').style.fontSize=$('fontSize').value+'px';persist()}
function step(t){if(!running)return;if(last){scrollPosition+=(t-last)*Number($('speed').value)/1000;$('viewer').scrollTop=scrollPosition}last=t;if(scrollPosition+$('viewer').clientHeight >= $('viewer').scrollHeight-2){stop();$('status').textContent='最後まで表示しました';return}frame=requestAnimationFrame(step)}
function stop(){running=false;cancelAnimationFrame(frame);last=0;$('play').textContent='▶ 自動スクロール'}
function toggleScroll(){if(running){stop();$('status').textContent='一時停止中';return}const v=$('viewer');if(v.scrollHeight<=v.clientHeight+2){$('status').textContent='歌詞が表示領域に収まっています。長い歌詞を読み込むか文字サイズを大きくしてください。';return}if(v.scrollTop+v.clientHeight>=v.scrollHeight-2)v.scrollTop=0;scrollPosition=v.scrollTop;running=true;last=0;$('status').textContent='自動スクロール中（'+$('speed').value+'px/秒）';$('play').textContent='Ⅱ 一時停止';frame=requestAnimationFrame(step)}
function page(d){stop();$('viewer').scrollBy({top:d*$('viewer').clientHeight*.85,behavior:'smooth'})}
function resetScroll(){stop();scrollPosition=0;$('viewer').scrollTo({top:0,behavior:'smooth'})}
function toggleFocus(){document.body.classList.toggle('compact');$('viewer').scrollTop=0}
function toggleFullscreen(){if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}}
function searchPetit(){const q=$('query').value.trim();window.open('https://petitlyrics.com/search_lyrics'+(q?'?title='+encodeURIComponent(q):''),'_blank','noopener')}
function saveLink(){const u=$('official').value.trim();if(!/^https:\/\/petitlyrics\.com\/lyrics\/\d+/.test(u)){alert('プチリリの歌詞ページURLを入力してください');return}localStorage.setItem('kasiview-link',u);$('status').textContent='公式ページURLを保存しました'}
function openOfficial(){const u=$('official').value.trim();if(/^https:\/\/petitlyrics\.com\/lyrics\/\d+/.test(u))window.open(u,'_blank','noopener');else alert('公式ページURLを入力してください')}
function persist(){try{localStorage.setItem('kasiview-v1',JSON.stringify({title:$('titleInput').value,artist:$('artistInput').value,lyrics:$('textInput').value,size:$('fontSize').value,speed:$('speed').value}))}catch(e){}}
try{const v=JSON.parse(localStorage.getItem('kasiview-v1')||'null');if(v){$('titleInput').value=v.title||'';$('artistInput').value=v.artist||'';$('textInput').value=v.lyrics||'';$('fontSize').value=v.size||32;$('speed').value=v.speed||25}else{$('titleInput').value='サンプル曲';$('artistInput').value='KasiView';$('textInput').value=sample}$('official').value=localStorage.getItem('kasiview-link')||''}catch(e){$('textInput').value=sample}
updateSettings();applyLyrics();
</script></body></html>
